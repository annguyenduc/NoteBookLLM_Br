<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant ID - Trợ Lý Thực Vật Học STEM</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --primary-dark: #1b5e20;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-dark);
    }

    .btn:disabled {
      background-color: #a5d6a7;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .spinner div {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 4px solid #c8e6c9;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-card {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      background-color: #f1f8e9;
      border-left: 5px solid var(--primary-color);
    }

    .result-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary-dark);
      margin: 0 0 5px 0;
    }

    .result-latin {
      font-style: italic;
      color: #555;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .badge-high { background-color: #c8e6c9; color: #1b5e20; }
    .badge-medium { background-color: #fff9c4; color: #f57f17; }
    .badge-low { background-color: #ffcdd2; color: #b71c1c; }

    .disclaimer {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
      border-top: 1px dashed #ccc;
      padding-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🌿 Plant ID Demo</h1>
    <p>Trợ lý thực vật học STEM - Nhận diện qua mô tả</p>
  </div>

  <div class="content">
    <div class="form-group">
      <label for="plantDesc">Mô tả đặc điểm cây trồng:</label>
      <textarea id="plantDesc" placeholder="VD: Cây thân gỗ to ở sân trường THCS, lá to xòe hình trứng mọc chụm ở đầu cành, mùa thu lá đổi màu đỏ rụng..."></textarea>
    </div>

    <button id="btnAnalyze" class="btn" onclick="analyzePlant()">Phân Tích Bằng Gemini AI</button>

    <div id="loading" class="spinner">
      <div></div>
      <p style="font-size: 13px; color: #666; margin-top: 8px;">Đang kết nối Gemini API phân tích...</p>
    </div>

    <div id="resultCard" class="result-card">
      <div id="plantName" class="result-title"></div>
      <div id="plantLatin" class="result-latin"></div>
      <div><span id="plantConfidence" class="badge"></span></div>
      <p id="plantDescription" style="line-height: 1.5; font-size: 14px;"></p>
      <div id="plantDisclaimer" class="disclaimer"></div>
    </div>
  </div>
</div>

<script>
  const API_KEY = '';
  const MODEL = 'gemini-flash-lite-latest';

  async function analyzePlant() {
    const desc = document.getElementById('plantDesc').value.trim();
    if (!desc) {
      alert('Vui lòng nhập mô tả đặc điểm cây trồng!');
      return;
    }

    const btn = document.getElementById('btnAnalyze');
    const loading = document.getElementById('loading');
    const resultCard = document.getElementById('resultCard');

    btn.disabled = true;
    loading.style.display = 'block';
    resultCard.style.display = 'none';

    const prompt = `Bạn là chuyên gia thực vật học Việt Nam.
Hãy nhận diện loài cây trồng được mô tả sau: "${desc}".

Trả về JSON duy nhất với cấu trúc:
{
  "name_vn": "Tên tiếng Việt",
  "name_scientific": "Tên khoa học",
  "family": "Họ thực vật",
  "description": "Mô tả ngắn 2 câu",
  "confidence": "High | Medium | Low",
  "disclaimer": "Kết quả mang tính tham khảo, cần kiểm tra lại với giáo viên"
}`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: 'application/json', temperature: 0.1 }
        })
      });

      const data = await response.json();
      const textOut = data.candidates[0].content.parts[0].text;
      const res = JSON.parse(textOut);

      document.getElementById('plantName').innerText = res.name_vn || 'Chưa xác định';
      document.getElementById('plantLatin').innerText = `${res.name_scientific || ''} (${res.family || ''})`;
      document.getElementById('plantDescription').innerText = res.description || '';
      document.getElementById('plantDisclaimer').innerText = '⚠️ ' + (res.disclaimer || 'Kết quả mang tính tham khảo');

      const badge = document.getElementById('plantConfidence');
      badge.innerText = 'Độ tin cậy: ' + (res.confidence || 'Low');
      badge.className = 'badge ' + (res.confidence === 'High' ? 'badge-high' : res.confidence === 'Medium' ? 'badge-medium' : 'badge-low');

      resultCard.style.display = 'block';
    } catch (err) {
      alert('Lỗi kết nối Gemini API: ' + err.message);
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  }
</script>

</body>
</html>
