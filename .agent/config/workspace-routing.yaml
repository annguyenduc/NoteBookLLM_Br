# Workspace routing registry cho EduResearch Hub v2.0
# Tất cả các kỹ năng (Skills) sử dụng file này để tìm vùng đệm xử lý.

version: 2.0

routing_contract:
  required_output_block: "ROUTING_DECISION"
  owner: "root AGENTS.md + this registry"
  rule: "Dispatcher luôn trỏ về vùng đệm chuẩn của EduResearch Hub."

routes:
  edu_research_hub:
    workspace: "Root Workspace"
    overlay: "AGENTS.md"
    default_mode: "education-design"
    default_buffer: "05_Kho_NguyenLieu/vung_dem_tho"
    intents:
      - "soạn giáo án"
      - "bóc tách pdf"
      - "tạo đề thi"
      - "nghiên cứu"
      - "kiểm định"
    forbidden_by_default:
      - "xóa tài liệu gốc"
      - "viết đè file chính thức nếu chưa qua vùng đệm"

official_ingest:
  workspace: "NONE"
  overlay: "NONE"
  default_mode: "obsolete"
  rule: "Luồng Ingest cũ đã bị loại bỏ."
